name: Deploy Beautes panel to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify workflows and panel
        run: |
          node --test tests/scheduling-flow.test.js tests/coworking-flow.test.js tests/api-confirmation.test.js tests/integration-boundaries.test.js
          node auditoria/2026-10-26/verificar-requisitos.cjs

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare public site
        run: |
          mkdir _site
          cp index.html Painel_Amanda.html pos_preenchimento_labial.jpg pos_botox.jpg pos_endolaser.jpg pos_cirurgia_face.jpg o_que_trazer_endolaser.jpg _site/

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
